name: Publish to npm

# Dispatched by release-please.yml on each new release tag. Run it by hand on a
# tag to retry a failed publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing (OIDC) needs npm >= 11.5.1, which Node 24 bundles.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Install pinned development dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify before publishing
        run: bun run check

      - name: Validate release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          TAG="${TAG#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match package.json version ($VERSION)"
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: npm_version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates through npm trusted publishing (OIDC, id-token: write);
      # no npm token secret is used.
      - name: Publish package with provenance
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public --provenance
